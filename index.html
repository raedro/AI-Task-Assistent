<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Task Assistant</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><div><p class="eyebrow">AI TASK ASSISTANT</p><h1>Organize your day.</h1><p class="muted">Turn simple notes into clear tasks and priorities.</p></div><button id="addBtn">+ Add task</button></header><section class="stats"><div><span>Today</span><strong id="todayCount">0</strong></div><div><span>Completed</span><strong id="doneCount">0</strong></div><div><span>Pending</span><strong id="pendingCount">0</strong></div></section><section class="panel"><div class="panel-head"><h2>My tasks</h2><select id="filter"><option value="all">All</option><option value="pending">Pending</option><option value="done">Completed</option></select></div><div id="tasks" class="tasks"><p class="empty">No tasks yet. Add your first task.</p></div></section></main><dialog id="dialog"><form method="dialog" id="taskForm"><h2>Add task</h2><label>Task<input id="title" required maxlength="120" placeholder="e.g. Study Python for 1 hour"></label><label>Due date<input id="due" type="date"></label><label>Priority<select id="priority"><option>Medium</option><option>High</option><option>Low</option></select></label><div class="actions"><button value="cancel">Cancel</button><button id="save" value="default">Add task</button></div></form></dialog><script src="app.js"></script></body></html>
